---
- name: Bootstrap Python3
  hosts: all
  gather_facts: false
  become: true

  tasks:

    - name: Update repository metadata
      ansible.builtin.raw: LANG=C zypper -n refresh
      register: zypper_refresh_output
      changed_when: "'Retrieving repository' in zypper_refresh_output.stdout"

    - name: Bootstrap python
      ansible.builtin.raw: LANG=C zypper -n install python3
      register: zypper_install_output
      changed_when:
        - "'Nothing to do' not in zypper_install_output.stdout"
